services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitness_user_db}
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 15

  mongodb:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status() } catch (e) {
          rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]})
          }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-fitness}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fitness_local}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8181
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8181:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  configserver:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE: configserver
    environment:
      SERVER_PORT: 8888
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness_local}
      USER_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fitness_user_db}
      ACTIVITY_MONGODB_URI: mongodb://mongodb:27017/fitnessactivity?replicaSet=rs0
      AI_MONGODB_URI: mongodb://mongodb:27017/fitnessrecommendation?replicaSet=rs0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-fitness}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-fitness_local}
      EUREKA_URL: http://eureka:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://localhost:8181/realms/fitness-oauth2
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/fitness-oauth2/protocol/openid-connect/certs
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  eureka:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE: eureka
    environment:
      SERVER_PORT: 8761
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  userservice:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE: userservice
    environment:
      CONFIG_SERVER_URL: http://configserver:8888
      SERVER_PORT: 8081
      USER_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fitness_user_db}
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness_local}
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  activityservice:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE: activityservice
    environment:
      CONFIG_SERVER_URL: http://configserver:8888
      SERVER_PORT: 8082
      ACTIVITY_MONGODB_URI: mongodb://mongodb:27017/fitnessactivity?replicaSet=rs0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-fitness}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-fitness_local}
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  aiservice:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE: aiservice
    environment:
      CONFIG_SERVER_URL: http://configserver:8888
      SERVER_PORT: 8083
      AI_MONGODB_URI: mongodb://mongodb:27017/fitnessrecommendation?replicaSet=rs0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-fitness}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-fitness_local}
      EUREKA_URL: http://eureka:8761/eureka/
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE: gateway
    environment:
      CONFIG_SERVER_URL: http://configserver:8888
      SERVER_PORT: 8080
      EUREKA_URL: http://eureka:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://localhost:8181/realms/fitness-oauth2
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/fitness-oauth2/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
      userservice:
        condition: service_healthy
      activityservice:
        condition: service_healthy
      aiservice:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  frontend:
    build:
      context: ./fitness-app-frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8080/api/
      VITE_KEYCLOAK_URL: http://localhost:8181
      VITE_KEYCLOAK_REALM: fitness-oauth2
      VITE_KEYCLOAK_CLIENT_ID: oauth2-pkce-client
    ports:
      - "5173:5173"
    depends_on:
      gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres-data:
  mongodb-data:
