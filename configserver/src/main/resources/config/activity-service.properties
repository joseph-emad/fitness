spring.application.name=activity-service

spring.mongodb.uri=${ACTIVITY_MONGODB_URI:mongodb://localhost:27017/fitnessactivity?replicaSet=rs0}
spring.mongodb.database=fitnessactivity

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

rabbitmq.exchange.name=fitness.exchange
rabbitmq.queue.name=activity.queue
rabbitmq.routing.key=activity.tracking
outbox.publisher.enabled=true
outbox.publisher.fixed-delay-ms=1000

server.port=8082

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
#eureka.instance.hostname=localhost

#logging.level.root=DEBUG